[project]
name = "kindle-hermes"
version = "1.0.0"
description = "Modular e-ink OS, smart lock-screen engine, and cross-device web companion for Kindle Paperwhite 10th Gen"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "icalendar>=6.0.1",
    "recurring-ical-events>=3.3.3",
    "pillow>=11.0.0",
    "playwright>=1.49.0",
    "google-genai>=1.0.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
